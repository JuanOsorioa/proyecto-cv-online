<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Osorio</title>
</head>
<body>
    <header>
        <nav>
            <!-- Icono izquierdo (GitHub) -->
            <button class="nav-icon nav-github">GitHub</button>
            <!-- Icono derecho (Perfil) -->
            <button class="nav-icon nav-profile">Perfil</button>
        </nav>
    </header>
    
    <main>
        <!-- Título principal ajustado según la jerarquía visual de la imagen -->
        <h1>Ingeniería De Software <u>Hecha Bien</u></h1>
        <!-- Subtítulo ajustado -->
        <h2>Juan Osorio</h2>
        
        <!-- Sección del carrusel expandida -->
        <section class="carrusel-container">
            <!-- Botón de flecha izquierda -->
            <button class="carrusel-btn prev" aria-label="Anterior">◀</button>
            
            <!-- Contenedor para las diapositivas o imágenes -->
            <div class="carrusel-pantalla">
                <!-- Aquí irá el contenido dinámico del carrusel -->
            </div>
            
            <!-- Botón de flecha derecha -->
            <button class="carrusel-btn next" aria-label="Siguiente">▶</button>
        </section>
    </main>
    
    <footer>
        <!-- Texto de copyright a la izquierda -->
        <p class="footer-copyright">Copyright © 2025 Juan Osorio</p>
        <!-- Enlace de contacto a la derecha -->
        <a href="#" class="footer-contacto">Contáctame</a>
    </footer>
